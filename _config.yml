theme: solar power bank with charger, using USB to Serial TTL converter, USB type-a & type-c.
title: solar_battery_bank
description: This project is a portable solar-powered USB-to-Serial TTL communication and charging system. 
The system combines a solar power bank with USB Type-A and USB Type-C outputs and a USB-to-TTL converter 
module. The power bank supplies portable power, while the USB-to-TTL converter enables communication 
between a computer and embedded devices, to be more specific an ESP32 modules, microcontrollers, sensors, 
and development boards.
